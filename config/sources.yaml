  - {name: Inc42, url: "https://inc42.com/feed/", region: india, poll: 600}
  - {name: YourStory, url: "https://yourstory.com/feed", region: india, poll: 600}
  - {name: Mint Companies, url: "https://www.livemint.com/rss/companies", region: india, poll: 900}
  - {name: The Arc, url: "https://thearcweb.com/feed", region: india, poll: 1800}
  - {name: ET Startups, url: "https://economictimes.indiatimes.com/small-biz/startups/rssfeeds/11993039.cms", region: india, poll: 900}
  - {name: TechCrunch Startups, url: "https://techcrunch.com/category/startups/feed/", region: global, poll: 600}
  - {name: Crunchbase News, url: "https://news.crunchbase.com/feed/", region: global, poll: 600}
  - {name: EU-Startups, url: "https://www.eu-startups.com/feed/", region: global, poll: 900}
  - {name: Sifted, url: "https://sifted.eu/feed", region: global, poll: 900}
  - {name: TechCabal, url: "https://techcabal.com/feed/", region: global, poll: 900}
  - {name: Rest of World, url: "https://restofworld.org/feed/", region: global, poll: 1800}
  - {name: PR Newswire VC, url: "https://www.prnewswire.com/rss/financial-services-latest-news/venture-capital-list.rss", region: global, poll: 600}
  - {name: Hacker News RSS, url: "https://news.ycombinator.com/rss", region: global, poll: 300}
  - {name: TechCrunch All, url: "https://techcrunch.com/feed/", region: global, poll: 900}

# Phase 2 API sources. SEC stays disabled until SEC_CONTACT_EMAIL is set.
hn:
  name: Hacker News Algolia
  queries: [raises, "seed round", "series a", "series b", funding, "who is hiring"]
  poll: 120
sec_form_d:
  name: SEC EDGAR Form D
  poll: 600
# ATS board tokens, all verified to return a job list (docs/phase2-proposals.md)
ats:
  greenhouse: [stripe, airbnb, coinbase, figma, discord, databricks, cloudflare, datadog, gitlab, anthropic, scaleai, brex, ramp, mercury, groww, razorpaysoftwareprivatelimited]
  lever: [palantir, spotify, paytm, cred, zeta]
  ashby: [ashby, notion, linear, openai, deel, vercel, supabase, replit, sarvam]
ats_poll: 1800

# Phase 3: dedicated alerts inbox (IMAP). Stays disabled until IMAP_USER and IMAP_PASSWORD are set.
imap:
  name: Alerts Inbox
  poll: 180

# Phase 4: public-page pollers. Watchlists start empty/generic until you name accounts (docs/decisions.md #29).
telegram_channels: []   # also editable in the UI (/watchlists). e.g. [{channel: some_public_channel, poll: 600}]
bluesky:                # Jetstream; posts from `accounts` (handles or DIDs) and accounts discovery adds
  name: Bluesky Jetstream
  accounts: []
page_monitors: []       # e.g. [{name: Acme careers, careers_url: "https://acme.com/careers", company: Acme, poll: 21600}]

# Phase 8 (decision 58). Jooble India pilot: stays OFF. Needs JOOBLE_API_KEY (register at jooble.org/api/about; one key per country)
# AND terms_confirmed: true, which you set only after confirming that this use is permitted. The free plan allows 100 requests/day.
jooble:
  name: Jooble India
  poll: 14400
  location: India
  pages: 1
  keywords: ["software engineer", "data scientist", "product manager", "devops engineer", "machine learning"]
  terms_confirmed: false
