# Template: scripts/install_cron.sh fills in @ROOT@ and runs logrotate on it daily (logrotate needs absolute paths).
# copytruncate: the backend, worker and frontend hold their log files open and keep writing after rotation.
@ROOT@/logs/*.log {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
