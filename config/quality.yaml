# Phase 11 thresholds. The first two were hard-coded; the values below are exactly what the code used, so behaviour is unchanged.
# Changing either one changes which events merge: re-run scripts/quality_report.py before and after (see docs/quality/).

entity_resolution:
  similarity: 0.85      # companies.match_company: trigram similarity at or above this is the same company

dedup:
  window_days: 7        # dedup.match_logical: the same event reported by two sources within this many days is one event

duplicate_audit:        # scripts/quality_report.py only; these never affect what the pipeline does
  company_similarity: 0.6   # two company rows this similar are reported as possible duplicates (looser than the merge rule)
                            # (two companies cannot share a domain: company_domains.domain is unique)
  company_word_similarity: 0.8  # ...or one name sits inside the other (a description left in the name)
  round_window_days: 14     # two rounds of one company this close, with compatible stage and amount, count as one
  alert_window_days: 7      # two funding alerts for the same company and amount this close count as a repeat
  target_rate: 0.05         # Phase 11 goal: each duplicate rate below 5 percent

identity:               # scripts/quality_report.py company identity section; report-only, never changes data
  # A name containing one of these words has a description in it ("French robot maker Genesis"). Matched on the canonical form
  # (lower case, punctuation became spaces), so "Denmark's" is the words "denmark" and "s". Ordinary brand words stay out
  # ("ai", "robotics", "labs"), or "Genesis AI" and "Remedy Robotics" would be flagged.
  descriptor_words: [french, german, danish, swedish, finnish, norwegian, dutch, british, indian, chinese, japanese, korean, israeli,
                     singaporean, canadian, australian, spanish, italian, swiss, irish, european, african, american, nigerian, kenyan,
                     brazilian, mexican, lankan, sri, denmark, france, germany, sweden, finland, norway, uk, us, s,
                     maker, makers, backer, backers, firm, firms, alums, alumni, startup, startups, platform, company, unicorn, giant,
                     vc, native, profitable, robot, crm, insurtech, fintech, edtech, healthtech, proptech, saas]
  institution_words: [capital, ventures, partners, fund, funds, university, institute, college, foundation, accelerator, incubator, pilani, iit, iim, bits]
  headline_verbs: [triples, doubles, quadruples, grows, hits, crosses, launches, acquires, hires, appoints, secures, raises]
  approx_fx: {INR: 88.0, EUR: 0.92, GBP: 0.78}   # units per US dollar, rough: used only to notice the same round reported in two currencies
  fx_tolerance: 0.10    # cross-currency amounts within this fraction count as the same (the rates above are approximate)

feedback:               # scripts/feedback.py (docs/feedback-design.md); nothing here affects alerts, scoring or ranking
  daily_budget: 5       # `next` hands out this many alerts a day to rate (the owner may raise it to 10 later)
  min_ratings: 30       # a precision is reported as a result only from this many drawn ratings per topic or source
  topics: [Global Funding, India Funding, Global Hiring, India Hiring]

classifier_eval:        # scripts/classifier_labels.py and quality.classifier_metrics; offline only, the live classifier (config/keywords.yaml) is never changed by it
  # What the live classifier can say. Every other label below means "not a startup funding alert" and is scored as `none`.
  labels: [funding, rumour, hiring, spam, none]
  negatives: [fund_close, debt_or_project_finance, sponsorship_or_naming, acquisition, grant, earnings_or_revenue, ipo_or_listing, layoffs_or_shutdown]
  # An unflagged event that matches one of these is "an unflagged event with a funding cue" (sampling stratum C: where missed funding hides).
  cue_regexes: ['[$€₹£]\s?\d', '\d[\d.,]*\s?(m|mn|million|b|bn|billion|cr|crore|lakh)\b', '\b(rais\w*|fund\w*|financ\w*|invest\w*|series [a-e]|seed|valuation|backed|led by|round|stealth|capital)\b']
  sample: {flagged_funding: 70, flagged_other: 40, unflagged_cue: 70, unflagged_no_cue: 60, seed: 21}
  # Second draw (fresh events, never in the 202): rows where the assistant's label and the classifier agree, to estimate errors both share. A/C/D = strata above.
  validation: {seed: 42, draw: {A: 24, C: 28, D: 20}, agree_quota: {A: 12, C: 16, D: 12}}
  # Candidate rule changes, run offline against the labels. NOTHING here is applied to alerts. `*_add` extends the live keyword lists;
  # `negative` is the proposed "not startup funding" path: a title term that turns a funding verdict into a named non-funding one.
  candidates:
    more_verbs_and_stages:
      verbs_add: [announces, financing, leads, backs, extends]
      stages_add: [pre seed, seed funding, pre-series b]
    rumour_phrases:
      not_funding_add: [to raise, to kick off, explores]
    not_startup_funding_negatives:
      negative:
        fund_close: [fund, first close, final close, closes on, vc firm]
        debt_or_project_finance: [debt, loan, venture debt, credit facility, project finance, bond]
        sponsorship_or_naming: [naming rights, sponsorship, title sponsor]
        acquisition: [acquires, acquired by, to acquire, merger, majority stake]
        grant: [grant, grants]
        earnings_or_revenue: [revenue, profit, earnings, quarterly results]
        ipo_or_listing: [ipo, files for, public offering, qip]
        layoffs_or_shutdown: [layoffs, lays off, shuts down, shutting down]
    all_three: {combine: [more_verbs_and_stages, rumour_phrases, not_startup_funding_negatives]}
